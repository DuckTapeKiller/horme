name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 (LTS): stylelint 18 needs 22.22 or newer, and
          # eslint-plugin-obsidianmd needs import.meta.dirname (Node 20+).
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # Obsidian's official plugin lint (eslint-plugin-obsidianmd). Fails on any warning.
      - name: Lint
        run: npx eslint . --max-warnings=0

      # The review bot checks styles.css against the oldest Chromium Obsidian
      # supports (Chrome 114): no :has, no partly supported features.
      - name: Lint styles
        run: npx stylelint styles.css --max-warnings=0

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
